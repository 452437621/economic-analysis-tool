    <script>

      (function () {
        var q = new URLSearchParams(location.search);
        var theme = q.get("theme");
        if (!theme) {
          try {
            theme = localStorage.getItem("epic-theme") || "dark";
          } catch (e) {
            theme = "dark";
          }
        }
        var resolved = theme;
        if (theme === "auto") {
          resolved = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        if (resolved !== "dark" && resolved !== "light" && resolved !== "sepia") resolved = "dark";
        document.documentElement.dataset.theme = resolved;
        document.documentElement.dataset.themeMode = theme;
        var updown = q.get("updown");
        if (!updown) {
          try {
            updown = localStorage.getItem("epic-updown") || "red";
          } catch (e) {
            updown = "red";
          }
        }
        document.documentElement.dataset.updown = updown === "green" ? "green" : "red";
      })();
    </script>
