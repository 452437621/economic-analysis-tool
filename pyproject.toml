[project]
name = "epic-market-analysis"
version = "1.3.0"
description = "EPIC - Economic Positioning, Intelligence & Cycles: personal macro-market-trading decision workbench"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "apscheduler>=3.10,<4",
    "httpx>=0.27",
    "pandas>=2.2",
    "duckdb>=1.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.12",
    "openpyxl>=3.1",
    "xlrd>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "backend" }
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
# --basetemp keeps tmp_path inside the workspace (git-ignored under data/);
# otherwise pytest may create pytest-of-<user>/ in the repo root on Windows.
addopts = "-p no:cacheprovider --basetemp=data/test/tmp"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py311"
