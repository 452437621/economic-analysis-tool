[project]
name = "epic-market-analysis"
version = "3.0.0"
description = "EPIC - Economic Positioning, Intelligence & Cycles: personal macro-market-trading decision workbench"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "apscheduler>=3.10,<4",
    "httpx>=0.27",
    "pandas>=2.2",
    "duckdb>=1.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.12",
    "openpyxl>=3.1",
    "xlrd>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "backend" }

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app", "app.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
# --basetemp keeps tmp_path inside the workspace (git-ignored under data/);
# otherwise pytest may create pytest-of-<user>/ in the repo root on Windows.
addopts = "-p no:cacheprovider --basetemp=data/test/tmp --import-mode=importlib"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: pure/offline unit tests",
    "integration: multi-module or DB/API integration",
    "api: FastAPI TestClient tests",
    "db: writes an isolated SQLite database",
    "frontend: reads frontend source/build, no browser",
    "release: release, packaging and script gates",
    "slow: takes more than two seconds",
    "windows: Windows-only",
    "posix: POSIX-only",
]

[tool.coverage.run]
source = ["backend/app"]
branch = true
relative_files = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# Initial conservative floor: the local line estimate is 76% and CI uses branch
# coverage, which reads lower. Raise this after the first CI coverage report.
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 110
target-version = "py311"
