name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint + backend tests + frontend tests (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Frontend tests (vitest)
        working-directory: frontend
        run: npm run test

      - name: Build frontend (Vue -> web/)
        working-directory: frontend
        run: npm run build

      - name: Static checks (scripts/lint.py)
        run: python scripts/lint.py

      - name: Backend tests with coverage
        env:
          EPIC_ENV: test
        run: python -m pytest -q --cov=app --cov-report=term-missing --cov-report=xml --maxfail=1

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python }}
          path: coverage.xml
          if-no-files-found: ignore

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.python }}
          path: |
            data/test/
          if-no-files-found: ignore
          retention-days: 7

  windows:
    name: windows scripts + full pytest
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        env:
          EPIC_PYTHON: python
        run: python scripts/epic.py build --skip-install

      - name: Static checks
        run: python scripts/lint.py

      - name: Backend tests
        env:
          EPIC_ENV: test
          EPIC_PYTHON: python
        run: python -m pytest -q --maxfail=1

      - name: Lifecycle smoke (PowerShell)
        env:
          EPIC_ENV: test
          EPIC_PYTHON: python
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/start.ps1 -NoBrowser -Port 8877
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/status.ps1 -Port 8877 -Json
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/stop.ps1 -Port 8877

      - name: Lifecycle smoke (cmd.exe)
        env:
          EPIC_ENV: test
          EPIC_PYTHON: python
        shell: cmd
        run: |
          scripts\start.cmd --no-browser --port 8878
          scripts\status.cmd --port 8878 --json
          scripts\stop.cmd --port 8878

  linux-scripts:
    name: linux shell wrappers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bash syntax check
        run: |
          for f in scripts/*.sh; do bash -n "$f"; done
      - name: Wrapper parity and lint
        run: |
          python -m pip install pyyaml
          python scripts/lint.py --quiet

  package:
    name: build package and import every module
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install and import
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python - <<'PY'
          import importlib, pkgutil, app
          mods = [m.name for m in pkgutil.walk_packages(app.__path__, "app.")]
          for name in mods:
              importlib.import_module(name)
          print("imported", len(mods), "modules")
          PY
      - name: Build wheel and assert subpackages
        run: |
          python -m pip wheel --no-deps --no-build-isolation -w dist .
          python - <<'PY'
          import zipfile
          from pathlib import Path
          wheel = next(Path("dist").glob("*.whl"))
          names = set(zipfile.ZipFile(wheel).namelist())
          required = [
              "app/cycle/__init__.py",
              "app/api/__init__.py",
              "app/ingest/providers/__init__.py",
              "app/ingest/collectors/__init__.py",
              "app/lens/__init__.py",
              "app/platform/__init__.py",
          ]
          missing = [name for name in required if name not in names]
          assert not missing, f"wheel missing {missing}"
          print("wheel ok:", wheel.name)
          PY
