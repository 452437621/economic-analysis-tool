triggers:
  - 中国溢价 ≥2.0% 与 COMEX 基差 ≥0.9% 两腿同触（ZP1）：纸面与实物分裂，只加实物、不加杠杆，空长端美债
  - SGE 租借 ≥1.5% 作为 ZP1 的第三腿单独确认：实物挤兑升级，黄金矿业与实物现货优先于纸黄金
  - 实际利率 63 日上行 ≥20bp 而金价 60 日不跌且在岸溢价 ≥0.8%（ZP2）：脱钩成立，金与长债反向
  - SOFR 单日跳升 >15bp 或 SOFR−EFFR >15bp（ZP5）：48 小时防守，卖一切换流动性，黄金也会先跌，之后看 ZP1 / ZP2 是否反手
  - SOFR−EFFR ≥8bp 且 RRP 缓冲垫 ≤2000 亿美元（ZP4）：摩擦是结构性的，减权益杠杆、加现金与短债
  - 利息/收入 TTM ≥25% 且 30s10s ≥50bp（ZP6）：财政主导确认，长端不再是避险资产，股债同跌概率上升
  - 净流动性 63 日缩水 ≥3000 亿美元且期限溢价走阔 ≥10bp（ZP7）：财政部抽水进长端，空长债、权益降久期
  - DXY 63 日 ≥+3 点同时 SOFR−EFFR ≥5bp（ZP8）：离岸美元荒，多美元、空非美与短期金
  - 央行 4 季度购金 ≥400 吨而美元分位 <60%（ZP3）：外部货币背书加速，黄金战略底仓不卖
  - 金 60 日 ≥+10% 且美元同期升值（ZP10）：货币信用定价启动，黄金与美元不再互斥
