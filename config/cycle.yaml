# ── 四情景（未来 6–36 个月）─────────────────────────────
scenarios:
  - id: S1
    name: 财政主导 / 温和通胀化债
    base: 0.35
    desc: 名义增长高于利率，债务靠通胀与金融抑制消化，实际利率被压低
    assets: 黄金、通胀保值债券、大宗商品占优；长久期名义债承压
    triggers: [赤字率维持 5% 以上, 实际利率被压低, 美元份额缓慢下行]
  - id: S2
    name: 温和放缓 / 软着陆
    base: 0.30
    desc: 增长回落但通胀同步下行，央行获得降息空间
    assets: 国债与高质量股票占优；信用利差收窄
    triggers: [增长分数回落至 40 以下, 通胀分数回落, 失业率温和上行]
  - id: S3
    name: 信用事件 / 硬着陆
    base: 0.20
    desc: 高利率下再融资失败或私募信贷/商业地产爆雷，信用收缩
    assets: 现金与国债占优；高收益债与周期股承压
    triggers: [信用利差走阔, SOFR−EFFR 利差抬升, 曲线急速陡峭化]
  - id: S4
    name: AI 生产率上行
    base: 0.15
    desc: 生产率提升压低单位成本，增长与利润同时改善
    assets: 科技与生产率受益资产占优；实际利率中枢上移
    triggers: [生产率增速上台阶, 企业利润率扩张, 通胀回落至 2% 附近]

# ── 预警规则（阈值可在前端调整，M4 落库）───────────────
alerts:
  - id: W1
    severity: high
    name: 长端利率失控风险
    metric: us_30y
    op: ">="
    threshold: 5.75
    why: 30 年期收益率突破 5.75% 会触发按揭与再融资的负反馈
    falsifier: 若随后 20 个交易日回落至 5.4% 以下则视为假警报
  - id: W2
    severity: high
    name: 曲线上移与财政主导共振
    metric: us_10y
    op: ">="
    threshold: 5.5
    why: 长端在降息周期仍上行，说明期限溢价主导，债券不再是避风港
    falsifier: 若伴随通胀预期回落而实际利率下行，则不成立
  - id: W3
    severity: medium
    name: 美元融资压力
    metric: us_sofr_spread
    op: ">="
    threshold: 0.10
    why: 回购溢价持续走阔往往先于流动性事件
    falsifier: 季末效应结束后回落则不计
  - id: W4
    severity: medium
    name: 黄金与美元同涨
    metric: gold_mom
    op: ">="
    threshold: 8.0
    why: 黄金与美元同涨说明市场在同时定价通胀与信用风险
    falsifier: 若实际利率同步上行则解释为避险而非信用折价
  - id: W5
    severity: high
    name: 央行购金潮
    metric: cb_gold
    op: ">="
    threshold: 300
    why: 央行黄金储备 12 个月净增超过 300 吨，意味着储备多元化加速
    falsifier: 若 ETF 流出抵消则对金价影响有限
    note: >-
      本地 gold_metrics.CB_GOLD_GLOBAL_TONNES 是「央行黄金储备存量（WGC/IFS 口径）」，
      取最接近 365 天的两个观测相减得到 12 个月净变化；与 WGC《Gold Demand Trends》
      的季度净购金（2026Q3 约 321 吨）不是同一口径，后者仅作外部交叉验证，
      不进入本引擎的自动阈值判断。
  - id: W6
    severity: medium
    name: 美元储备份额趋势下行
    metric: us_reserve_share
    op: "<="
    threshold: 55.0
    why: 份额跌破 55% 会强化储备多元化的自我实现预期
    falsifier: 若连续两季回升则视为噪声
  - id: W7
    severity: high
    name: 中美利差压制人民币
    metric: cn_us_spread
    op: "<="
    threshold: -350
    why: 利差过阔加大资本流出与汇率防守成本
    falsifier: 若出口顺差与结汇需求对冲则压力有限
  - id: W8
    severity: medium
    name: 中国长端利率过快下行
    metric: cn_10y
    op: "<="
    threshold: 1.5
    why: 长端快速下行反映资产荒与悲观预期
    falsifier: 若伴随信用扩张与通胀回升则属正常宽松
  - id: W9
    severity: medium
    name: 油价冲击
    metric: oil_mom
    op: ">="
    threshold: 15.0
    why: 能源冲击会同时推升通胀与压制增长
    falsifier: 若为供给短期扰动且库存高位则影响有限
  - id: W10
    severity: low
    name: 黄金超买
    metric: gold_rsi
    op: ">="
    threshold: 75.0
    why: 短期超买后回撤概率上升
    falsifier: 若由央行结构性买盘驱动则回撤有限
  - id: W11
    severity: high
    name: 政治事件窗口
    metric: political_days
    op: "<="
    threshold: 30
    why: 中期选举与关税到期前后政策不确定性抬升
    falsifier: 若事件结果符合预期则波动快速回落
  - id: W12
    severity: medium
    name: 内部秩序压力
    metric: us_polarization
    op: ">="
    threshold: 85
    why: 极化突破 85 分位后政策连续性与资产定价折价风险上升
    falsifier: 若跨党派法案通过则压力缓解
