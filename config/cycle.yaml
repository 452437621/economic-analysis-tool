# EPIC-C 2.0 周期引擎配置
#
# 设计依据：docs/22-EPIC-C周期引擎2.0.md、docs/24-原则库与当下研判.md
# 约定：
#   * 市场指标由数据库序列计算（macro_obs / market_bars），用 10 年滚动 z → 100×Φ(z) 映射到 0–100；
#   * 结构性指标（债务/GDP、储备份额、极化程度等）暂未接入 BIS/IMF/WID 的自动化数据源，
#     以「人工观测 + 来源 + 观测日 + 证据等级」登记在 manual 段，score 为专家映射值（0–100），
#     并在输出中标注 evidence 与 degrade，绝不把它们伪装成模型计算值；
#   * direction: +1 表示「数值上升 → 该打分维度更热/风险更高」；-1 相反；
#   * 所有阈值都放在本文件，改阈值不需要改代码。
version: 2.0.0

normalization:
  window_days: 2520      # 约 10 年日频，用于 z-score
  min_obs: 250           # 低于该样本量不做 z，直接降级
  clip_z: 3.5
  map: phi               # score = 100 * Φ(z)

# ── 分量打分器 ─────────────────────────────────────────────
# DMI 债务/货币（Debt & Money Index）：越高 = 债务周期越到后期、货币压力越大
# ICI 内部秩序（Internal Conflict Index）：越高 = 社会撕裂与政治功能失调越重
# ECI 外部秩序（External Conflict Index）：越高 = 大国冲突与秩序对抗越强
# GROWTH / INFLATION / LIQUIDITY：市场隐含的增长、通胀、流动性热度（0–100，50 为常态）
scores:
  DMI:
    name: 债务与货币压力
    higher: 越高越接近长债务周期后段
  ICI:
    name: 内部秩序压力
    higher: 越高社会撕裂越重
  ECI:
    name: 外部秩序压力
    higher: 越高地缘对抗越强
  GROWTH:
    name: 增长热度
    higher: 增长越强
  INFLATION:
    name: 通胀热度
    higher: 通胀压力越大
  LIQUIDITY:
    name: 流动性松紧
    higher: 越宽松

# ── 市场指标（可回算历史）─────────────────────────────────
indicators:
  - id: us_curve_slope
    name: 美债 10Y−2Y 斜率
    score: GROWTH
    weight: 0.30
    direction: 1
    expr: "US10Y - US2Y"
    unit: pp
    layer: 短债务周期
    why: 曲线倒挂是信用收缩与衰退的领先信号；陡峭化通常对应宽松或增长预期修复
    caveat: 本轮倒挂源于长端期限溢价与 QT，信号强度弱于 1990s
  - id: us_copper_gold
    name: 铜金比
    score: GROWTH
    weight: 0.20
    direction: 1
    expr: "CU / XAUUSD"
    unit: ratio
    layer: 增长
    why: 铜代表实体需求、黄金代表避险，比值上行通常对应增长改善
  - id: us_spx_mom
    name: 标普 500 60 日动量
    score: GROWTH
    weight: 0.20
    direction: 1
    expr: "SPX / SPX.shift(60) - 1"
    unit: pct
    layer: 增长
    why: 风险资产动量是增长与流动性预期的合成代理
    caveat: 估值驱动的上涨可能掩盖盈利下滑
  - id: us_breakeven
    name: 10 年盈亏平衡通胀
    score: INFLATION
    weight: 0.45
    direction: 1
    expr: "US10Y_BE"
    unit: "%"
    layer: 通胀
    why: 市场定价的通胀预期，是通胀周期的直接读数
  - id: oil_mom
    name: 原油 60 日动量
    score: INFLATION
    weight: 0.30
    direction: 1
    expr: "SC / SC.shift(60) - 1"
    unit: pct
    layer: 通胀
    why: 能源价格是 CPI 与通胀预期的主要冲击源
  - id: gold_mom
    name: 黄金 60 日动量
    score: INFLATION
    weight: 0.25
    direction: 1
    expr: "XAUUSD / XAUUSD.shift(60) - 1"
    unit: pct
    layer: 通胀
    why: 黄金同时反映通胀对冲与货币信用折价
    caveat: 央行购金等结构性需求会削弱其与通胀的短期相关性
  - id: us_real10y
    name: 10 年实际利率
    score: LIQUIDITY
    weight: 0.35
    direction: -1
    expr: "US10Y_REAL"
    unit: "%"
    layer: 信用/流动性
    why: 实际利率是金融条件的核心价格；上行等同收紧
  - id: us_effr
    name: 有效联邦基金利率
    score: LIQUIDITY
    weight: 0.25
    direction: -1
    expr: "EFFR"
    unit: "%"
    layer: 信用/流动性
    why: 政策利率水平决定短端资金成本
  - id: dxy_mom
    name: 美元指数 60 日动量
    score: LIQUIDITY
    weight: 0.20
    direction: -1
    expr: "DXY / DXY.shift(60) - 1"
    unit: pct
    layer: 信用/流动性
    why: 美元走强收紧全球美元流动性，尤其冲击新兴市场
  - id: cn_curve_slope
    name: 中国 10Y−2Y 斜率
    score: GROWTH
    weight: 0.35
    direction: 1
    expr: "CN10Y - CN2Y"
    unit: pp
    layer: 短债务周期
    why: 中国曲线形态与信用脉冲方向高度相关
  - id: cn_asset_mom
    name: 沪深 300 60 日动量
    score: GROWTH
    weight: 0.35
    direction: 1
    expr: "000300 / 000300.shift(60) - 1"
    unit: pct
    layer: 增长
    why: A 股是政策与信用条件的快速映射
  - id: cn_credit_proxy
    name: 中国 10 年国债收益率
    score: LIQUIDITY
    weight: 0.50
    direction: -1
    expr: "CN10Y"
    unit: "%"
    layer: 信用/流动性
    why: 长端利率下行通常对应货币宽松与资产荒
  - id: us_sofr_spread
    name: SOFR−EFFR 利差
    score: DMI
    weight: 0.15
    direction: 1
    expr: "SOFR_EFFR"
    unit: pp
    layer: 信用/流动性
    why: 回购市场相对政策利率的溢价，是美元融资压力的高频读数
  - id: us_30y
    name: 30 年美债收益率
    score: DMI
    weight: 0.20
    direction: 1
    expr: "US30Y"
    unit: "%"
    layer: 债务
    why: 长端收益率计入期限溢价与财政可持续性折价
  - id: gold_level_mom
    name: 黄金 250 日动量
    score: DMI
    weight: 0.15
    direction: 1
    expr: "XAUUSD / XAUUSD.shift(250) - 1"
    unit: pct
    layer: 货币信用
    why: 黄金中期强势是货币信用折价与去美元化的价格证据
  - id: us_10y
    name: 10 年美债收益率
    score: DMI
    weight: 0.15
    direction: 1
    expr: "US10Y"
    unit: "%"
    layer: 债务
    why: 无风险利率抬升加重存量债务的再融资成本

