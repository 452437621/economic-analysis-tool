# ── 长债务周期 7 阶段 ────────────────────────────────────
# 用 DMI 分数定位，enter/exit 构成滞回带，避免阈值附近来回跳变。
long_cycle:
  phases:
    - id: normal
      name: 正常
      band: [0, 25]
      meaning: 债务增速与收入增速匹配，杠杆温和
      asset: 风险资产中性偏多，久期中性
    - id: bubble_early
      name: 泡沫早期
      band: [25, 40]
      meaning: 信贷加速、资产价格上涨开始脱离现金流
      asset: 股票与信用债占优，开始降低杠杆
    - id: bubble_late
      name: 泡沫后期
      band: [40, 55]
      meaning: 杠杆增速超过收入，新增债务的边际产出下降
      asset: 减持高杠杆资产，增加现金与黄金
    - id: top
      name: 顶部
      band: [55, 70]
      meaning: 债务/收入接近极限，紧缩开始拖累增长
      asset: 长久期债券风险上升，黄金与现金占优
    - id: deflationary
      name: 紧缩/去杠杆
      band: [70, 82]
      meaning: 信用收缩、资产价格下跌、去杠杆压力显性化
      asset: 现金与国债阶段性占优，股票承压
    - id: printing
      name: 印钞/货币化
      band: [82, 90]
      meaning: 央行购买债务、实际利率被压低
      asset: 黄金、通胀保值资产、非美货币占优
    - id: debasement
      name: 货币贬值/秩序重构
      band: [90, 100]
      meaning: 货币信用受损，储备货币地位与资本管制成为议题
      asset: 黄金与实物资产，规避本币计价债券
  hysteresis: 3.0

# ── 短债务周期 5 态（5–8 年）────────────────────────────
short_cycle:
  states: [复苏, 扩张, 过热, 放缓, 衰退]
  # 规则按顺序匹配：growth/inflation/liq 为 0–100 分；d12 为增长 12 个月变化
  rules:
    - when: "growth < 40 and d12 > 0"
      state: 复苏
      meaning: 增长从低位回升，通胀仍低，政策仍偏松
    - when: "growth >= 40 and growth < 70 and inflation < 60"
      state: 扩张
      meaning: 增长稳健、通胀温和，是风险资产最友好的阶段
    - when: "inflation >= 60 and growth >= 45"
      state: 过热
      meaning: 通胀高企迫使央行收紧，估值与久期承压
    - when: "growth < 45 and inflation >= 45"
      state: 放缓
      meaning: 增长下滑但通胀仍有黏性（滞胀风险）
    - when: "growth < 40 and d12 <= 0"
      state: 衰退
      meaning: 增长与通胀同步回落，信用事件概率上升
  default: 放缓
  hysteresis: 2.0

# ── 库存周期（3–4 年，工业品代理）───────────────────────
inventory_cycle:
  proxies: [CU, I, ZN, NI]
  states:
    - id: 主动补库
      meaning: 价格与库存同步上行，需求真实
      asset: 工业品与周期股占优
    - id: 被动补库
      meaning: 需求转弱、库存被动累积
      asset: 降低周期暴露
    - id: 主动去库
      meaning: 需求下滑，企业主动减产清库存
      asset: 防御与现金占优
    - id: 被动去库
      meaning: 需求回升、库存被动下降，补库前夜
      asset: 提前布局工业品
  rules:
    - when: "price_mom > 3 and inv_mom > 0"
      state: 主动补库
    - when: "price_mom <= 3 and inv_mom > 0"
      state: 被动补库
    - when: "price_mom < -3 and inv_mom < 0"
      state: 主动去库
    - when: "price_mom >= -3 and inv_mom < 0"
      state: 被动去库

# ── 世界大周期（内部秩序 / 国际秩序分开显示）─────────────
world:
  internal_stages:
    - id: 1
      name: 新秩序
    - id: 2
      name: 制度建设
    - id: 3
      name: 和平与繁荣
    - id: 4
      name: 债务与分歧
    - id: 5
      name: 财政糟糕与冲突
    - id: 6
      name: 内战与革命
  external_stages:
    - id: 1
      name: 单极稳定
    - id: 2
      name: 多极摩擦
    - id: 3
      name: 规则失效
    - id: 4
      name: 全面对抗
  # 人工阶段判定：stages 未自动化，必须写明依据、来源与观测日
  judgments:
    - id: us_internal
      name: 美国内部秩序阶段
      stage: 5
      confidence: 0.66
      evidence: E4
      asof: 2026-11-17
      reason: 债务与赤字高企、极化与抗议上升、财政空间收窄，中期选举后冲突显性化；按达利欧六阶段框架为「财政糟糕与冲突」。
      falsifier: 若赤字率回落至 3% 以下且极化指数连续 2 年下降，则阶段判定下调。
      source: docs/23-历史周期图谱1500-2026.md §5；达利欧 2026 年公开表态
      url: https://www.economicprinciples.org/
    - id: global_order
      name: 国际秩序阶段
      stage: 2
      confidence: 0.58
      evidence: E4
      asof: 2026-11-17
      reason: 美元储备份额 56.70% 仍居主导但趋势下行、关税与制裁常态化、区域冲突多点，处于「多极摩擦」而非规则完全失效。
      falsifier: 若美元份额单季下滑超过 2pp 或出现对主要经济体的全面金融制裁，则上调至规则失效。
      source: docs/23-历史周期图谱1500-2026.md §5；IMF COFER
      url: https://data.imf.org/regular.aspx?key=41175
