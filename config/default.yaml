# EPIC 默认配置（非敏感；可由 .env / 环境变量覆盖）
app:
  name: EPIC
  timezone: Asia/Shanghai
  host: 127.0.0.1
  port: 8765

market:
  # 重点覆盖：内外盘同品种 + 有色链（V1 交易池）
  instruments:
    precious:
      - {symbol: XAUUSD, name: 伦敦金现, asset_class: metal, currency: USD}
      - {symbol: GC, name: COMEX黄金, asset_class: metal, currency: USD, exchange: COMEX}
      - {symbol: SI, name: COMEX白银, asset_class: metal, currency: USD, exchange: COMEX}
      - {symbol: AU, name: 沪金, asset_class: metal, currency: CNY, exchange: SHFE}
      - {symbol: AG, name: 沪银, asset_class: metal, currency: CNY, exchange: SHFE}
    energy:
      - {symbol: CL, name: WTI原油, asset_class: energy, currency: USD, exchange: NYMEX}
      - {symbol: BZ, name: Brent原油, asset_class: energy, currency: USD, exchange: ICE}
      - {symbol: SC, name: 原油, asset_class: energy, currency: CNY, exchange: INE}
    industrial:
      - {symbol: CU, name: 沪铜, asset_class: metal, currency: CNY, exchange: SHFE}
      - {symbol: AL, name: 沪铝, asset_class: metal, currency: CNY, exchange: SHFE}
      - {symbol: ZN, name: 沪锌, asset_class: metal, currency: CNY, exchange: SHFE}
      - {symbol: NI, name: 沪镍, asset_class: metal, currency: CNY, exchange: SHFE}
      - {symbol: HG, name: LME铜, asset_class: metal, currency: USD, exchange: LME}
      - {symbol: AL_LME, name: 伦铝, asset_class: metal, currency: USD, exchange: LME}
      - {symbol: ZN_LME, name: 伦锌, asset_class: metal, currency: USD, exchange: LME}
      - {symbol: NI_LME, name: 伦镍, asset_class: metal, currency: USD, exchange: LME}
    fx:
      - {symbol: DXY, name: 美元指数(代理), asset_class: fx, currency: USD}
      - {symbol: USDCNH, name: 离岸人民币, asset_class: fx, currency: CNY}
      - {symbol: USDJPY, name: 美元日元, asset_class: fx, currency: JPY}
      - {symbol: EURUSD, name: 欧元美元, asset_class: fx, currency: USD}
      - {symbol: GBPUSD, name: 英镑美元, asset_class: fx, currency: USD}
      - {symbol: USDCAD, name: 美元加元, asset_class: fx, currency: CAD}
      - {symbol: USDSEK, name: 美元瑞典克朗, asset_class: fx, currency: SEK}
      - {symbol: USDCHF, name: 美元瑞郎, asset_class: fx, currency: CHF}
    equity:
      - {symbol: "000300", name: 沪深300, asset_class: equity, currency: CNY}
      - {symbol: "603993", name: 洛阳钼业, asset_class: equity, currency: CNY}
      - {symbol: SPX, name: 标普500, asset_class: equity, currency: USD}
      - {symbol: NDX, name: 纳斯达克100, asset_class: equity, currency: USD}
      - {symbol: DJIA, name: 道琼斯, asset_class: equity, currency: USD}
      - {symbol: HSI, name: 恒生指数, asset_class: equity, currency: HKD}
    agri:
      - {symbol: M, name: 豆粕, asset_class: agri, currency: CNY, exchange: DCE}
      - {symbol: P, name: 棕榈油, asset_class: agri, currency: CNY, exchange: DCE}
      - {symbol: SR, name: 白糖, asset_class: agri, currency: CNY, exchange: CZCE}
      - {symbol: CF, name: 棉花, asset_class: agri, currency: CNY, exchange: CZCE}
    black:
      - {symbol: I, name: 铁矿石, asset_class: black, currency: CNY, exchange: DCE}

macro:
  series:
    - {code: US2Y, name: 美债2年, unit: "%", freq: d, country: US}
    - {code: US10Y, name: 美债10年, unit: "%", freq: d, country: US}
    - {code: US30Y, name: 美债30年, unit: "%", freq: d, country: US}
    - {code: US5Y_REAL, name: 美债5年实际利率, unit: "%", freq: d, country: US}
    - {code: US10Y_REAL, name: 美债10年实际利率, unit: "%", freq: d, country: US}
    - {code: US5Y_BE, name: 5年盈亏平衡通胀, unit: "%", freq: d, country: US}
    - {code: US10Y_BE, name: 10年盈亏平衡通胀, unit: "%", freq: d, country: US}
    - {code: JP2Y, name: 日本国债2年, unit: "%", freq: d, country: JP}
    - {code: JP10Y, name: 日本国债10年, unit: "%", freq: d, country: JP}
    - {code: JP30Y, name: 日本国债30年, unit: "%", freq: d, country: JP}
    - {code: DE2Y, name: 德国国债2年, unit: "%", freq: d, country: DE}
    - {code: DE10Y, name: 德国国债10年, unit: "%", freq: d, country: DE}
    - {code: CN2Y, name: 中国国债2年, unit: "%", freq: d, country: CN}
    - {code: CN5Y, name: 中国国债5年, unit: "%", freq: d, country: CN}
    - {code: CN10Y, name: 中国国债10年, unit: "%", freq: d, country: CN}
    - {code: CN30Y, name: 中国国债30年, unit: "%", freq: d, country: CN}
    - {code: CN10Y2Y, name: 中国国债10年-2年利差, unit: pp, freq: d, country: CN}

news:
  feeds:
    - {name: 美联储, url: "https://www.federalreserve.gov/feeds/press_all.xml", tier: S1}
    - {name: 欧洲央行, url: "https://www.ecb.europa.eu/rss/press.html", tier: S1}
    - {name: 美国财政部, url: "https://home.treasury.gov/news/press-releases", tier: S1, type: html}

llm:
  extract_model: deepseek-chat
  reason_model: deepseek-reasoner
  daily_budget_usd: 5
  cache: true

scheduler:
  heartbeat_seconds: 60
  brief_premarket: "07:30"
  brief_postmarket: "21:00"

data:
  quote_delay_note:
    cn_futures: "实时（新浪，约 3-60 秒）"
    cn_equity: "实时（东财，约 3-5 秒）"
    overseas: "免费源约 15 分钟延迟或日线"
    rates: "日频（美国财政部 CSV，17:00 ET 后）"
